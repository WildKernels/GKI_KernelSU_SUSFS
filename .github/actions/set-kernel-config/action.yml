name: Set Kernel Config
description: Apply config entries to gki_defconfig with the kernel's own scripts/config

inputs:
  config_list:
    required: true
    description: "Kernel config lines (CONFIG_FOO=y, =m, =n, or =<value>); lines starting with # are comments"

runs:
  using: composite
  steps:
  - name: Patch gki_defconfig
    shell: bash
    # Passed through env, never interpolated into the script text: a value like
    # CONFIG_DEFAULT_TCP_CONG="bbr" contains quotes, and `CONFIG_LIST="${{ ... }}"`
    # would let them terminate the string and silently drop the quoting.
    env:
      CONFIG_LIST: ${{ inputs.config_list }}
    working-directory: ${{ github.workspace }}/kernel/common
    run: |
      set -euo pipefail

      DEFCONFIG="arch/arm64/configs/gki_defconfig"

      if [ ! -f "$DEFCONFIG" ]; then
        echo "ERROR: gki_defconfig not found" >&2
        exit 1
      fi
      if [ ! -f scripts/config ]; then
        echo "ERROR: scripts/config not found in $PWD" >&2
        exit 1
      fi

      # bash, not sh: scripts/config is `#!/usr/bin/env bash` and uses [[ ]] and
      # arrays, so dash (Ubuntu's /bin/sh) dies with
      #   scripts/config: 129: Syntax error: "(" unexpected
      # Running it through bash also covers trees that ship it non-executable.
      kc() { bash scripts/config "$@"; }

      # scripts/config knows the three shapes the kernel actually emits
      # (CONFIG_X=y, CONFIG_X=m, "# CONFIG_X is not set") and writes the right
      # one for the requested state. The previous sed implementation had to
      # guess, and its `s|^KEY=.*|KEY=value|g` replacement mangles values that
      # contain a pipe or quotes.
      apply_line() {
        local line="$1"
        line="$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
        [[ -z "$line" || "$line" == \#* ]] && return 0

        local key value
        if [[ "$line" == *"="* ]]; then
          key="${line%%=*}"
          value="${line#*=}"
        else
          key="$line"
          value="y"
        fi

        case "$value" in
          y) kc --file "$DEFCONFIG" --enable  "$key" ;;
          m) kc --file "$DEFCONFIG" --module  "$key" ;;
          n) kc --file "$DEFCONFIG" --disable "$key" ;;
          *) kc --file "$DEFCONFIG" --set-val "$key" "$value" ;;
        esac

        # Verify the file reflects the request. A silent no-op here means the
        # build believes it has a feature that is not actually enabled.
        case "$value" in
          y|m) grep -qE "^${key}=[ym]$" "$DEFCONFIG" || {
                 echo "ERROR: ${key}=${value} not present after scripts/config" >&2; exit 1; } ;;
          n)   grep -qE "^(# ${key} is not set|${key}=n)$" "$DEFCONFIG" || {
                 echo "ERROR: ${key} not disabled after scripts/config" >&2; exit 1; } ;;
          *)   grep -qF "${key}=${value}" "$DEFCONFIG" || {
                 echo "ERROR: ${key}=${value} not present after scripts/config" >&2; exit 1; } ;;
        esac

        echo "Set: ${key}=${value}"
      }

      while IFS= read -r line || [ -n "$line" ]; do
        apply_line "$line"
      done <<< "$CONFIG_LIST"
