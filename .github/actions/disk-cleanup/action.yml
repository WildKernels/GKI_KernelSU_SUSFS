name: 'Disk Cleanup'
description: 'Delete runner-image bloat in parallel (fast path) and report the free space it left behind'

outputs:
  free_gb:
    description: 'Free space on / after the cleanup, in GiB'
    value: ${{ steps.cleanup.outputs.free_gb }}

runs:
  using: 'composite'
  steps:
    - name: Delete unnecessary toolchains and SDKs
      id: cleanup
      shell: bash
      run: |
        set -uo pipefail

        free_gb() { echo $(( $(df -Pk / | awk 'NR==2 {print $4}') / 1024 / 1024 )); }

        echo "Free space before cleanup: $(free_gb) GiB"
        df -h / | tail -n +2 || true

        # Straight deletion, in parallel, and *waited on*. The previous version
        # moved each tree into the workspace and deleted it in the background:
        # that rename frees nothing inside the same filesystem, so `df` kept
        # reading the pre-cleanup number while space was only reclaimed
        # mid-build. Nothing here sits on its own mount, so --one-file-system
        # guards against a stray bind mount widening the blast radius.
        targets=(
          /usr/share/dotnet
          /usr/local/lib/android
          /opt/ghc
          /opt/hostedtoolcache/CodeQL
          /opt/hostedtoolcache/go
          /opt/hostedtoolcache/PyPy
          /opt/hostedtoolcache/node
          /usr/local/aws-sam-cli
          /usr/local/aws-cli
          /usr/local/share/chromium
          /usr/local/share/powershell
          /usr/local/lib/heroku
          /usr/local/lib/node_modules
          /opt/az
          /opt/microsoft/powershell
          /usr/share/swift
          /usr/share/miniconda
          /usr/share/gradle
          /usr/local/julia
        )

        pids=()
        for t in "${targets[@]}"; do
          if [ -e "$t" ]; then
            sudo rm -rf --one-file-system "$t" &
            pids+=($!)
          fi
        done
        for p in "${pids[@]}"; do wait "$p" || true; done

        FREE_GB="$(free_gb)"
        echo "Free space after cleanup: ${FREE_GB} GiB"
        df -h / | tail -n +2 || true
        echo "free_gb=${FREE_GB}" >> "$GITHUB_OUTPUT"
