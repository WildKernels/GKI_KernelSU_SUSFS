name: 'Reject FinaSU without SUSFS'
description: 'Reject FinaSU without SUSFS (composite, keeps the workflow to one entry)'
inputs:
  feature_set:
    description: 'feature_set'
    required: false
  root_flavor:
    description: 'root_flavor'
    required: false

runs:
  using: "composite"
  steps:
    - name: Reject FinaSU without SUSFS
      shell: bash
      run: |
        echo "ERROR: FinaSU requires SUSFS — re-run with SUSFS on." >&2
        exit 1
