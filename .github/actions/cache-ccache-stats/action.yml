name: 'Show ccache Stats'
description: 'Display ccache statistics, hit rates, and config'
inputs:
  clear_stats:
    description: 'Whether to clear ccache stats after displaying (default: true)'
    required: true
    type: boolean
    default: true

runs:
  using: 'composite'
  steps:
    - name: Show ccache Stats
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        echo "===================="
        echo "=== ccache stats ==="
        echo "===================="

        if ! command -v ccache >/dev/null 2>&1; then
          echo "[!]  ccache not installed, skipping ccache stats"
          echo "===================="
          exit 0
        fi

        echo "=== ccache config ==="
        echo "====================="
        ccache -p || true
        echo "====================="

        # Format note: this repo pins a self-built ccache ("master.<sha>") whose
        # `-s` prints ONLY the local-storage table -- no "Cacheable calls:" /
        # "Hits:" lines. The old parser therefore always took the else branch
        # and reported hit_rate=0.0%, which is how a completely bypassed ccache
        # looked like a healthy-but-cold cache instead of a bug. Prefer the
        # machine-readable --print-stats and treat "no cacheable calls after a
        # build" as an error, not a zero rate.
        PRINTED="$(ccache --print-stats 2>/dev/null || true)"
        if [ -n "$PRINTED" ]; then
          echo "=== ccache --print-stats ==="
          echo "$PRINTED"
          HITS=$(awk -F'\t' '$1 ~ /^cache_hit/ {s+=$2} END{print s+0}' <<<"$PRINTED")
          MISSES=$(awk -F'\t' '$1 ~ /^cache_miss/ {s+=$2} END{print s+0}' <<<"$PRINTED")
          CACHEABLE=$(( HITS + MISSES ))
          DIRECT=$(awk -F'\t' '$1 ~ /^cache_hit_direct/ {s+=$2} END{print s+0}' <<<"$PRINTED")
        else
          STATS="$(ccache -s 2>/dev/null || true)"
          echo "=== ccache -s ==="
          echo "$STATS"
          CACHEABLE=$(echo "$STATS" | awk '/Cacheable calls:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
          HITS=$(echo "$STATS" | awk '/^[[:space:]]*Hits:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
          DIRECT=$(echo "$STATS" | awk '/Direct:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
        fi

        CACHEABLE=${CACHEABLE:-0}
        HITS=${HITS:-0}
        DIRECT=${DIRECT:-0}

        if [ "$CACHEABLE" -gt 0 ]; then
          HIT_RATE=$(awk -v h="$HITS" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (h/c)*100}')
          DIRECT_RATE=$(awk -v d="$DIRECT" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (d/c)*100}')
          echo "hit_rate=${HIT_RATE}%"
          echo "direct_rate=${DIRECT_RATE}%"
        else
          echo "hit_rate=0.0%"
          echo "direct_rate=0.0%"
          if [ "${{ inputs.clear_stats }}" = "false" ]; then
            echo "::error::ccache saw zero cacheable calls during the build -- the compiler wrapper is not in the compile path"
          fi
        fi

        if [ "${{ inputs.clear_stats }}" = "true" ]; then
          echo "=== ccache reset ==="
          echo "====================="
          ccache -z || true
          echo "====================="

          if [ -d /home/runner/.ccache ] && find /home/runner/.ccache -type f -print -quit 2>/dev/null | grep -q .; then
            # -mtime, not atime: ccache's own LRU is mtime-based, and the
            # prune in build.yml filters on -mtime too. The log line used to
            # say "atime" which is what made this look like a bug.
            find /home/runner/.ccache -type f -exec touch -t $(date -d "1 day ago" +%Y%m%d%H%M) {} +
            echo "[+] ccache mtime updated"
          fi
        fi
