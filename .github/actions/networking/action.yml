name: 'Setup Networking'
description: 'Set up all networking options (IP Set, TCP CC, Qdisc, BBRv3, CIFS, Wireguard)'
inputs:
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Kernel sublevel'
    required: true
  os_patch_level:
    description: 'OS patch level ("lts" selects the lts variant patches when present)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Setup Networking Configs
      uses: ./.github/actions/networking-config

    # BBRv3 is not shipped on this branch - it lives on feat/bbrv3, where the
    # ports are measured zero-drift. The action's patch steps are commented out
    # there, so running it here only appended nothing and logged
    # "CONFIG_TCP_CONG_BBR3 is not declared in this tree - the patch did not
    # land, config skipped" on every 6.18 leg (3 warnings per run, run
    # 43959326934). Re-enable this step together with that branch's patches.
    # - name: Apply BBRv3 Patches
    #   uses: ./.github/actions/bbrv3
    #   with:
    #     version: ${{ inputs.version }}
    #     kernel_version: ${{ inputs.kernel_version }}
    #     sublevel: ${{ inputs.sublevel }}
    #     os_patch_level: ${{ inputs.os_patch_level }}

    - name: Setup CIFS Configs
      uses: ./.github/actions/cifs
      with:
        version: ${{ inputs.version }}
