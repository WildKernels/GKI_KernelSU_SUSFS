name: 'Add kernel configs'
description: >-
  Append config entries to the shared wild fragment (common/wild_defconfig.fragment), which the
  build applies as a defconfig fragment. Replaces set-kernel-config: entries no longer
  edit gki_defconfig, they accumulate in one place and the appending step is named.

inputs:
  config_list:
    description: 'Config entries, one per line (CONFIG_X=y, CONFIG_X=n, # CONFIG_X is not set)'
    required: true
  label:
    description: 'Name of the contributing step, shown in the log'
    required: false
    default: 'step'

runs:
  using: composite
  steps:
    - name: Append to the wild fragment
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      env:
        CONFIG_LIST: ${{ inputs.config_list }}
        LABEL: ${{ inputs.label }}
      run: |
        set -euo pipefail
        printf '%s\n' "$CONFIG_LIST" \
          | python3 "${{ github.workspace }}/.github/scripts/append_fragment.py" - \
              --dest wild_defconfig.fragment --label "$LABEL"
