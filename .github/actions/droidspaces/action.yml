name: Setup Droidspaces-OSS
description: Clone and apply Droidspaces-OSS patches with version-specific fixes
inputs:
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true
  android_version:
    description: 'Android version (e.g., android15)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.6)'
    required: true
  os_patch_level:
    description: 'OS patch level (e.g., 2024-07)'
    required: true
  sublevel:
    description: 'Kernel sublevel'
    required: true
  droidspaces_commit:
    description: 'Pinned Droidspaces-OSS commit (empty = main tip)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Download and Apply Droidspaces-OSS Patches
      uses: ./.github/actions/retry
      with:
        command: |
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git
        attempts: 5
        delay: 5
        workdir: ${{ github.workspace }}
        # A clone that dies mid-transfer leaves Droidspaces-OSS/ behind, and
        # the next attempt then fails instantly with "destination path already
        # exists" — so without this, all 5 attempts fail deterministically.
        cleanup: rm -rf Droidspaces-OSS

    - name: Pin Droidspaces-OSS to resolved commit
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        if [ -n "${{ inputs.droidspaces_commit }}" ]; then
          git -C Droidspaces-OSS fetch --depth=1 origin "${{ inputs.droidspaces_commit }}"
          git -C Droidspaces-OSS checkout "${{ inputs.droidspaces_commit }}"
          [ "$(git -C Droidspaces-OSS rev-parse HEAD)" = "${{ inputs.droidspaces_commit }}" ] || { echo "Droidspaces pin mismatch" >&2; exit 1; }
        fi

    - name: Apply the SYSVIPC kABI fix
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        if [ "${{ inputs.version }}" == "android16-6.12" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch ./
          patch -p1 < 001.GKI-6.12-or-above-fix_sysvipc_kabi.patch
        elif [ "${{ inputs.version }}" == "android15-6.6" ]; then
          #curl -L https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_1_2_3.patch
          #curl -L https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android14-6.1" ]; then
          #curl -L https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_1_2_3.patch
          #curl -L https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android14-5.15" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android13-5.15" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android12-5.10" ] || [ "${{ inputs.version }}" == "android13-5.10" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch ./
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch ./
          patch -p1 < 002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
        fi

    - name: Export IPC symbols for module linkage
      if: inputs.version == 'android16-6.12' || inputs.version == 'android17-6.18'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        python3 "${{ github.workspace }}/.github/scripts/binder_ipc_ns_exports.py" "$PWD"

    - name: Apply the 6.18 SysV task-table port
      # CONFIG_SYSVIPC adds two members to task_struct, and any change to that member
      # list moves 6,329 of 9,741 modver CRCs - even when the bytes land at identical
      # offsets. DroidSpaces relocate the members instead (reserve slots below 6.12, a
      # 28-byte hole from 6.12 up); 6.18 has neither, so this port deletes the members
      # outright and keeps the state in an xarray keyed by task pointer.
      # Measured on android17-6.18: 0 of 9,741 symbols differ from stock.
      if: false
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        P="${{ github.workspace }}/.github/patches/sysvipc-618/001-task-table.patch"
        if grep -q 'sysv_task_state_get' ipc/sem.c; then
          echo "task-table port already applied"
          exit 0
        fi
        git apply -v "$P" || { echo "ERROR: the 6.18 SysV port did not apply" >&2; exit 1; }
        grep -q 'sysv_task_state_get' ipc/sem.c || { echo "ERROR: port applied but sem.c unchanged" >&2; exit 1; }
        echo "task-table port applied"

    - name: Run the real CFS bandwidth code with side-table state
      # CONFIG_CFS_BANDWIDTH stays off, so struct cfs_rq and task_group keep their
      # stock layouts, but the scheduler's own bandwidth code is compiled in and
      # its state lives in side tables keyed by the cfs_rq / task_group pointers.
      # That gives the real cpu.max, cpu.max.burst, cpu.stat and slice sysctl
      # instead of an approximation, with no struct or CRC change.
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        python3 "${{ github.workspace }}/.github/scripts/ds_cfs_bandwidth.py" "$PWD"

    - name: Keep CFS_BANDWIDTH and CGROUP_PIDS out of the exported ABI
      # Both options are off in stock GKI and both move genksyms' view of types
      # that exported symbols reach, so both are shadowed on
      # !defined(__GENKSYMS__): the compiler gets the real layout, genksyms gets
      # the stock one, which is what stock builds anyway. Same technique as the
      # BBRv3 ports, and safe because neither struct is in the GKI module headers.
      #
      #   CFS_BANDWIDTH: members in struct cfs_bandwidth / struct cfs_rq; struct
      #   rq embeds cfs_rq, so every exported symbol naming 'struct rq *' moves
      #   (__traceiter_android_rvh_*, __task_rq_lock, __migrate_task,
      #   __balance_callbacks).
      #
      #   CGROUP_PIDS: a SUBSYS(pids) entry increments CGROUP_SUBSYS_COUNT, the
      #   constant that sizes fixed arrays in struct cgroup and struct css_set,
      #   so both grow and it propagates widely - measured on
      #   android14-6.1-2026-06 without this guard: 3241 of 8865 symbols drifted
      #   (job 134742656292), against 0 with the options off (job 133855319348).
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        python3 "${{ github.workspace }}/.github/scripts/droidspaces_kabi_shadow.py" "$PWD"

    - name: Provide pids.max without a cgroup subsystem
      # CONFIG_CGROUP_PIDS is NOT enabled: registering the pids subsystem
      # increments CGROUP_SUBSYS_COUNT, which resizes arrays inside struct cgroup
      # and struct css_set, and prebuilt vendor modules then read stock offsets
      # against a bigger struct (3241 of 8865 symbol CRCs moved; with the CRCs
      # forced back to stock the device still did not boot). This installs
      # pids.max / pids.current as cgroup base files with state in an xarray, so
      # DroidSpaces keeps the feature and no struct changes.
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        python3 "${{ github.workspace }}/.github/scripts/ds_pids_limit.py" "$PWD"

    - name: Provide cpu.max without CFS_BANDWIDTH
      # CFS_BANDWIDTH grows cfs_rq inside struct rq, which moves fields that
      # vendor modules read at compile-time offsets - the device stopped booting
      # with it even when the CRCs were shadowed back to stock (44286900753,
      # 44466030716), and boots with it off. This enforces the quota from outside
      # the scheduler: per-cgroup state, a 5 ms sampler, freeze/thaw at the period
      # boundary. No struct changes. Skipped when the fragment enables the real
      # CFS_BANDWIDTH.
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        python3 "${{ github.workspace }}/.github/scripts/ds_cpu_limit.py" "$PWD"

    - name: Append the DS configs to the wild fragment
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        A="${{ github.workspace }}/.github/actions/droidspaces"
        S="${{ github.workspace }}/.github/scripts/append_fragment.py"
        python3 "$S" "$A/droidspaces_defconfig.fragment" --dest wild_defconfig.fragment --label droidspaces
        # CONFIG_SYSVIPC is only free where task_struct can absorb it. On 6.18 that
        # requires the SysV task-table port, which is disabled, so the IPC pair is
        # appended everywhere else and skipped there - enabling it on 6.18 moved
        # 6,388 exported-symbol CRCs (run 43743517821) and the ABI gate rejected it.
        if [ "${{ inputs.version }}" = "android17-6.18" ]; then
          echo "[-] 6.18: skipping the IPC fragment (SysV task-table port is disabled)"
        else
          python3 "$S" "$A/droidspaces-ipc.fragment" --dest wild_defconfig.fragment --label droidspaces-ipc
        fi
