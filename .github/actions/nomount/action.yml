name: Setup pinned NoMount
description: Integrate NoMount with its upstream SHA-pinned setup script
inputs:
  commit:
    description: 'Full immutable NoMount commit SHA'
    required: true

runs:
  using: composite
  steps:
    - name: Run upstream setup script at the pinned revision
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        expected_commit="${{ inputs.commit }}"
        if ! [[ "$expected_commit" =~ ^[0-9a-f]{40}$ ]]; then
          echo "NoMount commit must be a full 40-character SHA." >&2
          exit 2
        fi
        if [ -e common/NoMount ] || [ -e common/fs/nomount ]; then
          echo "Refusing to reuse an existing NoMount integration." >&2
          exit 1
        fi

        setup_script="${RUNNER_TEMP}/nomount-setup-${expected_commit}.sh"
        curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
          "https://raw.githubusercontent.com/maxsteeel/nomount/${expected_commit}/kernel/setup.sh" \
          --output "$setup_script"
        test -s "$setup_script"
        chmod 0755 "$setup_script"
        (
          cd common
          "$setup_script" "$expected_commit"
        )

        actual_commit="$(git -C common/NoMount rev-parse HEAD)"
        if [ "$actual_commit" != "$expected_commit" ]; then
          echo "NoMount commit mismatch: expected $expected_commit, got $actual_commit." >&2
          exit 1
        fi
        if [ ! -L common/fs/nomount ] || [ ! -f common/fs/nomount/Kconfig ]; then
          echo "Upstream NoMount setup did not create the expected fs/nomount integration." >&2
          exit 1
        fi
        echo "NOMOUNT_COMMIT=$actual_commit" >> "$GITHUB_ENV"

    - name: Enable NoMount configuration
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_NOMOUNT=y
