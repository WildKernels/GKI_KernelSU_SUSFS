name: 'ABI gate'
description: 'Fail the build if any symbol CRC differs from the stock GKI ABI of the tree being built'

inputs:
  family:
    description: 'Config family (android14-6.1) - reported in the log'
    required: true
  mode:
    description: 'check = fail on ANY drift, update = only report what drifted'
    required: false
    default: check

runs:
  using: composite
  steps:
    - name: Compare Module.symvers CRCs against the stock GKI ABI
      # Policy: every build keeps the stock ABI of the kernel it is built from.
      # There is no allowlist and no exception list - if a symbol's CRC is not
      # the stock one, the leg fails. Features that cannot keep stock CRCs are
      # therefore off by default: fanotify is ported to stay byte-identical,
      # CFS_BANDWIDTH (moves struct rq) and CGROUP_PIDS (moves the cgroup arrays)
      # are opt-in. The answer to a red gate is to disable the config or fix the
      # port, never to record the drift.
      #
      # Why this exists: the kleaf families strip the ABI lists in
      # remove-protected-exports, so bazel's own protected-exports check has
      # nothing to compare and a config that grows an ABI struct builds green.
      # Legacy families do run compare_to_symbol_list, but against a list
      # generated from the same tree, so it cannot show a difference either.
      #
      # android/abi_gki_aarch64.stg ships in the kernel tree and carries
      # `crc: 0x…` next to every ABI-tracked symbol (8,911 on 6.1), i.e. that
      # family's stock ABI exactly as that tree defines it.
      shell: bash
      env:
        FAMILY: ${{ inputs.family }}
        MODE: ${{ inputs.mode }}
      run: |
        # GitHub runs `shell: bash` as bash -e -o pipefail; -e turns an expected
        # non-zero (grep with no match, a guard test) into a step failure, so this
        # step does its own error handling.
        set +e

        OURS=$(find -L . "${OUT_DIR:-/home/runner/out}" -maxdepth 8 \
                 -name 'Module.symvers' -type f -size +0 2>/dev/null | head -n1)
        # 6.1/6.6 keep it at android/abi_gki_aarch64.stg; 6.12 and 6.18 moved it
        # to gki/aarch64/abi.stg, same format.
        STG=$(find -L . "${OUT_DIR:-/home/runner/out}" -maxdepth 8 \
                \( -name 'abi_gki_aarch64.stg' -o -name 'abi.stg' \) \
                -type f -size +0 2>/dev/null | head -n1)
        # 5.10 and 5.15 predate the .stg; they carry the same CRCs as attributes
        # of <elf-symbol> in the libabigail XML.
        XML=$(find -L . "${OUT_DIR:-/home/runner/out}" -maxdepth 8 \
                -name 'abi_gki_aarch64.xml' -type f -size +0 2>/dev/null | head -n1)

        if [ -z "${OURS:-}" ] || [ ! -f "$OURS" ]; then
          echo "::error title=ABI gate::no Module.symvers in this build - cannot verify the ABI"
          exit 1
        fi
        echo "ABI gate: family=$FAMILY mode=$MODE"
        echo "ABI gate: ours=$OURS"

        # Module.symvers: <crc> <symbol> <module> <export>
        awk -F'\t' 'NF>=2 && $1 ~ /^0x/ {print $2"\t"$1}' "$OURS" | LC_ALL=C sort -u > /tmp/ours.tsv

        if [ -n "${STG:-}" ] && [ -f "$STG" ]; then
          echo "ABI gate: stock=$STG (.stg)"
          # .stg records are elf_symbol { id: 0x…  name: "sym" … crc: 0x…  }.
          # `crc:` is the modversions CRC; `id:` is the type id.
          awk '
            /^elf_symbol \{/ {insym=1; nm=""; crc=""; next}
            insym && /^[[:space:]]*name:[[:space:]]*"/ {nm=$0; sub(/.*name:[[:space:]]*"/, "", nm); sub(/".*/, "", nm); next}
            insym && /^[[:space:]]*crc:[[:space:]]*0x/ {crc=$2; next}
            insym && /^\}/ {if (nm != "" && crc != "") print nm"\t"crc; insym=0; next}
          ' "$STG" | LC_ALL=C sort -u > /tmp/stock.tsv
        elif [ -n "${XML:-}" ] && [ -f "$XML" ]; then
          echo "ABI gate: stock=$XML (.xml)"
          # 5.10/5.15 predate the .stg: same CRCs, carried as attributes of
          # <elf-symbol name='X' … crc='0x…'/> in the libabigail XML.
          perl -ne 'if (/<elf-symbol\b([^>]*)>/) { $a = $1;
              ($n) = $a =~ /name=.([^\x27]+)./;
              ($c) = $a =~ /crc=.([^\x27]+)./;
              print "$n\t$c\n" if defined $n && defined $c }' "$XML" \
            | LC_ALL=C sort -u > /tmp/stock.tsv
        else
          # Nothing found at all: no .stg and no XML anywhere in this tree. Warn
          # loudly rather than pretend the ABI was checked.
          echo "::warning title=ABI gate::no in-tree ABI definition (.stg or .xml) for $FAMILY - ABI unverified"
          {
            echo ""
            echo "### ABI gate - $FAMILY"
            echo ""
            echo "**UNVERIFIED** - this tree ships no \`android/abi_gki_aarch64.stg\` or \`.xml\`, so there is no stock CRC to compare against."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 0
        fi

        # join wants byte order; the default locale collation silently drops rows
        LC_ALL=C join -t $'\t' -1 1 -2 1 /tmp/ours.tsv /tmp/stock.tsv > /tmp/joined.tsv
        compared=$(wc -l < /tmp/joined.tsv)
        awk -F'\t' '$2!=$3' /tmp/joined.tsv > /tmp/drift.tsv
        drifted=$(wc -l < /tmp/drift.tsv)

        if [ "$MODE" = "update" ]; then
          echo "ABI gate: mode=update - $drifted of $compared symbols differ from stock"
          echo "BEGIN-ABI-DRIFT"
          awk -F'\t' '{printf "%s\t%s\t# stock %s\n", $1,$2,$3}' /tmp/drift.tsv
          echo "END-ABI-DRIFT"
          exit 0
        fi

        {
          echo ""
          echo "### ABI gate - stock ABI of $FAMILY"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| symbols compared against stock | $compared |"
          echo "| **differ from stock** | **$drifted** |"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

        if [ "$drifted" -gt 0 ]; then
          echo "ABI gate: $drifted symbol(s) differ from stock:"
          awk -F'\t' '{printf "  %s  ours=%s stock=%s\n", $1,$2,$3}' /tmp/drift.tsv | head -40
          [ "$drifted" -gt 40 ] && echo "  ... $((drifted - 40)) more - full list: re-dispatch with abi_mode=update"
          printf '%s' "$(awk -F'\t' '{print $1}' /tmp/drift.tsv | head -6 | tr '\n' ' ')" > /tmp/names
          echo "::error title=ABI drift::$(cat /tmp/names)$([ "$drifted" -gt 6 ] && echo "...") - $drifted symbol(s) no longer match the stock ABI. Disable the config that caused it (CFSBW / pids / fanotify) or fix the port; this repo keeps the stock ABI."
          exit 1
        fi

        echo "ABI gate: OK - $compared symbols compared against stock, 0 differ"
