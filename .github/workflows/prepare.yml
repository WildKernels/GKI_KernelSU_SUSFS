name: Prepare and Build

on:
  workflow_call:
    inputs:
      config_file:
        description: "Path to the JSON config file"
        required: true
        type: string
      feature_set:
        description: "Feature Set"
        required: false
        type: string
      ksu_branch:
        description: "KernelSU branch or commit (empty = latest dev)"
        required: false
        type: string
        default: ""
      susfs_commit:
        description: "SUSFS commit hash (empty = latest on auto-derived branch)"
        required: false
        type: string
        default: ""
      root_flavor:
        description: "Mutually exclusive root implementation (kernelsu, next, bakasu, finasu, sukisu-ultra, or none)"
        required: false
        type: string
        default: ""
      root_commit:
        description: "Exact root implementation commit"
        required: false
        type: string
        default: ""
      nomount_commit:
        description: "Exact NoMount commit"
        required: false
        type: string
        default: ""
      kernel_patches_commit:
        description: "Exact kernel_patches commit (resolved automatically)"
        required: false
        type: string
        default: ""
      anykernel3_commit:
        description: "Exact AnyKernel3 commit (resolved automatically)"
        required: false
        type: string
        default: ""
      droidspaces_commit:
        description: "Exact Droidspaces-OSS commit (resolved automatically)"
        required: false
        type: string
        default: ""
      produce_stock_configs:
        description: "false = another leg of this run produces the stock-configs artifact"
        required: false
        type: boolean
        default: true
      brand_name:
        description: "Kernel branding text appended to the version string (empty = stock)"
        required: false
        type: string
        default: Wild
      keep_kmi:
        description: "Keep stock KMI generation suffix in kernel version (fix #265)"
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        description: "Force-load modules with mismatched symbol versions ( force check_version() to pass )"
        required: false
        type: boolean
        default: false
      use_cache:
        description: "Enable ccache/bazel cache"
        required: false
        type: boolean
        default: true
      os_patch_level:
        description: "Optional filter: patch date (YYYY-MM), kernel sublevel, lts (LTS branch), or all"
        required: false
        type: string
        default: ""
      variant:
        description: "Artifact variant label"
        required: false
        type: string
        default: ""
      page_size:
        description: "ARM64 page size: 4k (default) or 16k"
        required: false
        type: string
        default: "4k"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.final.outputs.matrix }}
      version_slug: ${{ steps.final.outputs.version_slug }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read Config and Build Final Matrix
        id: final
        shell: bash
        env:
          INPUT_OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        run: |
          if [ ! -f "${{ inputs.config_file }}" ]; then
            echo "Error: Config file not found: ${{ inputs.config_file }}"
            exit 1
          fi

          CONFIG_JSON=$(cat "${{ inputs.config_file }}" | jq -c .)

          # Build { "include": [ {android_version:..., kernel_version:..., sublevel:..., os_patch_level:..., variant: ...}, ... ] }.
          # An explicit patch-level filter keeps manual validation dispatches bounded.
          FINAL=$(jq -cn \
            --argjson cfg "$CONFIG_JSON" \
            --arg requested_variant "${{ inputs.variant }}" '
            ($cfg.version | split("-")) as $version_parts
            | ($cfg.include) as $targets
            | {
              include: (
                [
                  $targets[] as $item
                  | {
                      version: $cfg.version,
                      android_version: $version_parts[0],
                      kernel_version: $version_parts[1],
                      sublevel: $item.sublevel,
                      os_patch_level: $item.date,
                      variant: (if $requested_variant == "" then "Normal" else $requested_variant end)
                    }
                ]
                + (if $requested_variant == "" then [
                    $targets[] as $item
                    | select($item.variant != null)
                    | {
                        version: $cfg.version,
                        android_version: $version_parts[0],
                        kernel_version: $version_parts[1],
                        sublevel: $item.sublevel,
                        os_patch_level: $item.date,
                        variant: $item.variant
                      }
                  ] else [] end)
                | unique_by([.android_version, .kernel_version, .sublevel, .os_patch_level, .variant])
              )
            }')

          SELECTED_PATCH_LEVEL="$(printf '%s' "$INPUT_OS_PATCH_LEVEL" | tr '[:upper:]' '[:lower:]')"
          if [ "$SELECTED_PATCH_LEVEL" = "all" ]; then
            SELECTED_PATCH_LEVEL=""
          fi
          if [ -n "$SELECTED_PATCH_LEVEL" ]; then
            FULL_FINAL="$FINAL"
            FINAL=$(jq -c --arg patch_level "$SELECTED_PATCH_LEVEL" '
              {include: [.include[] | select(.os_patch_level == $patch_level)]}
            ' <<< "$FINAL")
            # No date matched -- try interpreting the value as a kernel sublevel
            if [ "$(jq '.include | length' <<< "$FINAL")" -eq 0 ]; then
              FINAL=$(jq -c --arg sublevel "$SELECTED_PATCH_LEVEL" '
                {include: [.include[] | select(.sublevel == $sublevel)]}
              ' <<< "$FULL_FINAL")
            fi
          fi
          if [ "$(jq '.include | length' <<< "$FINAL")" -eq 0 ]; then
            echo "Error: no build targets match patch level '${SELECTED_PATCH_LEVEL}'." >&2
            exit 1
          fi

          echo "matrix=$FINAL" >> "$GITHUB_OUTPUT"
          echo "version_slug=$(jq -r '.include[0].version' <<< "$FINAL" | tr '._' '-')" >> "$GITHUB_OUTPUT"

  stock-configs:
    # Produces the stock GKI configs ONCE per family. main.yml sets
    # produce_stock_configs=false for the non-first flavor legs of an
    # All run - they consume the artifact the first leg uploaded
    # (with a live-download fallback if they get there too early).
    # Branches that call prepare.yml directly keep the default (true).
    needs: generate-matrix
    if: inputs.produce_stock_configs != 'false'
    runs-on: ubuntu-latest
    outputs:
      version_slug: ${{ steps.prep.outputs.version_slug }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Derive Family and Kernel Versions
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          VERSION_SLUG="$(jq -r '.include[0].version' <<< '${{ needs.generate-matrix.outputs.matrix }}' | tr '._' '-')"
          KVERS="$(jq -r '[.include[].kernel_version] | unique | join(" ")' <<< '${{ needs.generate-matrix.outputs.matrix }}')"
          jq -r '[.include[] | .kernel_version + " " + (.android_version | sub("^android"; ""))] | unique | .[]' \
            <<< '${{ needs.generate-matrix.outputs.matrix }}' > "${RUNNER_TEMP}/stock-pairs.txt"
          {
            echo "version_slug=${VERSION_SLUG}"
            echo "kvers=${KVERS}"
          } >> "$GITHUB_OUTPUT"
          echo "[*] stock-configs: family=${VERSION_SLUG} kvers=${KVERS}"

      - name: Resolve Upstream Prebuilt Revisions
        id: heads
        shell: bash
        run: |
          set -euo pipefail
          HASH_INPUT=""
          : > "${RUNNER_TEMP}/stock-heads.txt"
          # gitiles JSON payloads start with a )]}' prefix line — strip it.
          while read -r KVER ANDROID_NUM; do
            [ -n "$KVER" ] || continue
            BASE="https://android.googlesource.com/kernel/prebuilts/${KVER}/arm64"
            MAIN_HEAD="$(curl -fsSL --retry 3 --max-time 30 "${BASE}/+refs/heads/main?format=JSON" | tail -n +2 | jq -r --arg r "refs/heads/main" '.[$r].value // empty' || true)"
            REL_HEAD="$(curl -fsSL --retry 3 --max-time 30 "${BASE}/+refs/heads/android${ANDROID_NUM}-release?format=JSON" | tail -n +2 | jq -r --arg r "refs/heads/android${ANDROID_NUM}-release" '.[$r].value // empty' || true)"
            HASH_INPUT="${HASH_INPUT}${KVER}:${MAIN_HEAD}:${REL_HEAD}"$'\n'
            echo "${KVER}=${MAIN_HEAD}${REL_HEAD}" >> "${RUNNER_TEMP}/stock-heads.txt"
            echo "[*] ${KVER} (android${ANDROID_NUM}): main=${MAIN_HEAD:0:12} release=${REL_HEAD:0:12}"
          done < "${RUNNER_TEMP}/stock-pairs.txt"
          CACHE_KEY="stock-configs-v1-$(printf '%s' "$HASH_INPUT" | sha256sum | cut -d' ' -f1)"
          echo "cache_key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore Stock Config Cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/stock-configs
          key: ${{ steps.heads.outputs.cache_key }}
          restore-keys: |
            stock-configs-v1-

      - name: Fetch Missing Stock Kernels and Extract Configs
        shell: bash
        env:
          PAGE_SIZE: ${{ inputs.page_size }}
        run: |
          set -uo pipefail
          STOCK_DIR="${RUNNER_TEMP}/stock-configs"
          mkdir -p "$STOCK_DIR"

          fetch_one() {
            # $1 = kernel version, $2 = subdir suffix ("" or /16k), $3 = output .config path
            local KVER="$1" SUBDIR="$2" OUT="$3" MAJ REF URL BASE
            MAJ="$(awk -v k="$KVER" '$1 == k { print $2; exit }' "${RUNNER_TEMP}/stock-pairs.txt")"
            BASE="https://android.googlesource.com/kernel/prebuilts/${KVER}/arm64"
            # Newer kernels land on an android<NN>-release branch first; main
            # can be an empty tree until AOSP promotes them (6.18 today).
            for REF in "refs/heads/main" "refs/heads/android${MAJ}-release"; do
              URL="${BASE}/+/${REF}${SUBDIR}/kernel-${KVER}-gz?format=TEXT"
              echo "[*] Downloading kernel-${KVER}-gz${SUBDIR} @ ${REF}"
              if curl -fsSL --retry 3 --retry-delay 5 --max-time 600 "$URL" | base64 -d > "${OUT}.img" && [ -s "${OUT}.img" ]; then
                if sh .github/scripts/extract-ikconfig "${OUT}.img" > "$OUT" && [ -s "$OUT" ]; then
                  rm -f "${OUT}.img"
                  return 0
                fi
                echo "[!] extract-ikconfig failed for kernel-${KVER}-gz${SUBDIR}" >&2
              fi
              rm -f "${OUT}.img"
            done
            return 1
          }

          for KVER in ${{ steps.prep.outputs.kvers }}; do
            CUR_HEAD="$(grep -m1 "^${KVER}=" "${RUNNER_TEMP}/stock-heads.txt" | cut -d= -f2- || true)"
            OUT4="${STOCK_DIR}/stock_${KVER}.config"
            if [ -f "$OUT4" ] && [ -n "$CUR_HEAD" ] \
               && [ "$(cat "${STOCK_DIR}/heads/${KVER}.head" 2>/dev/null || true)" = "$CUR_HEAD" ]; then
              echo "[+] ${KVER}: cache hit, upstream unchanged"
            else
              echo "[*] ${KVER}: fetching stock config (missing or upstream moved)"
              if fetch_one "$KVER" "" "$OUT4"; then
                mkdir -p "${STOCK_DIR}/heads"
                printf '%s' "$CUR_HEAD" > "${STOCK_DIR}/heads/${KVER}.head"
              else
                echo "::error title=stock-configs::could not fetch stock config for ${KVER} — required, not optional" >&2
                exit 1
              fi
            fi
            if [ "$PAGE_SIZE" = "16k" ]; then
              OUT16="${STOCK_DIR}/stock_${KVER}_16k.config"
              if [ -f "$OUT16" ] && [ -n "$CUR_HEAD" ] \
                 && [ "$(cat "${STOCK_DIR}/heads/${KVER}_16k.head" 2>/dev/null || true)" = "$CUR_HEAD" ]; then
                echo "[+] ${KVER}: 16k cache hit, upstream unchanged"
              else
                echo "[*] ${KVER}: fetching 16k stock config"
                if fetch_one "$KVER" "/16k" "$OUT16"; then
                  mkdir -p "${STOCK_DIR}/heads"
                  printf '%s' "$CUR_HEAD" > "${STOCK_DIR}/heads/${KVER}_16k.head"
                else
                  echo "::error title=stock-configs::could not fetch 16k stock config for ${KVER} — required, not optional" >&2
                  exit 1
                fi
              fi
            fi
          done

      - name: Save Stock Config Cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/stock-configs
          key: ${{ steps.heads.outputs.cache_key }}

      - name: Upload Stock Configs Artifact
        uses: actions/upload-artifact@v7
        with:
          name: stock-configs-${{ steps.prep.outputs.version_slug }}
          path: ${{ runner.temp }}/stock-configs/stock_*.config
          if-no-files-found: warn

  build:
    # stock-configs may be skipped on non-producer legs (produce_stock_configs=false)
    needs: [generate-matrix, stock-configs]
    if: ${{ !cancelled() && needs.generate-matrix.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ matrix.version }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}
      sublevel: ${{ matrix.sublevel }}
      os_patch_level: ${{ matrix.os_patch_level }}
      variant: ${{ matrix.variant }}
      feature_set: ${{ inputs.feature_set }}
      ksu_branch: ${{ inputs.ksu_branch }}
      susfs_commit: ${{ inputs.susfs_commit }}
      root_flavor: ${{ inputs.root_flavor }}
      root_commit: ${{ inputs.root_commit }}
      nomount_commit: ${{ inputs.nomount_commit }}
      kernel_patches_commit: ${{ inputs.kernel_patches_commit }}
      anykernel3_commit: ${{ inputs.anykernel3_commit }}
      droidspaces_commit: ${{ inputs.droidspaces_commit }}
      brand_name: ${{ inputs.brand_name }}
      keep_kmi: ${{ inputs.keep_kmi }}
      allow_version_mismatch: ${{ inputs.allow_version_mismatch }}
      use_cache: ${{ inputs.use_cache }}
      page_size: ${{ inputs.page_size }}
      stock_config_artifact: stock-configs-${{ needs.generate-matrix.outputs.version_slug }}
    secrets: inherit
