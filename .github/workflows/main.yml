  update-verified-pins:
    concurrency:
      group: update-verified-pins-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    if: "github.event_name == 'workflow_dispatch' && !inputs.test_release_notes && inputs.commit_mode == 'update'"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    needs:
    - resolve-sources
    - build-android12-5-10
    - build-android13-5-10
    - build-android13-5-15
    - build-android14-5-15
    - build-android14-6-1
    - build-android15-6-6
    - build-android16-6-12
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
        token: ${{ github.token }}

    - name: Promote verified pins on success
      id: promote
      shell: bash
      run: |
        set -euo pipefail
        python3 .github/scripts/update_verified_pins.py
      env:
        GH_TOKEN: ${{ github.token }}
        NOMOUNT_SHA: ${{ needs.resolve-sources.outputs.nomount_commit }}
        KERNELSU_SHA: ${{ needs.resolve-sources.outputs.ksu_commit }}
        RESUKISU_SHA: ${{ needs.resolve-sources.outputs.resukisu_commit }}
        APPROVE_NOMOUNT: ${{ inputs.use_nomount }}
        APPROVE_KERNELSU: ${{ (inputs.root_flavor == 'KernelSU' || inputs.root_flavor == 'All') }}
        APPROVE_RESUKISU: ${{ (inputs.root_flavor == 'ReSukiSU' || inputs.root_flavor == 'All') }}

    - name: Commit promoted pins
      if: always() && steps.promote.conclusion == 'success'
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        STAMP="$(date -u +%Y-%m-%dT%H%M%SZ)"
        git add .github/workflows/main.yml .github/pins/history
        if git diff --cached --quiet; then
          echo "No pin changes to commit."
          exit 0
        fi
        git commit -m "chore(pins): promote verified commits to latest built (${STAMP})"
        git push
  rej:
    if: "github.event_name == 'workflow_dispatch' && !inputs.test_release_notes && always()"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    needs:
    - build-android12-5-10
    - build-android13-5-10
    - build-android13-5-15
    - build-android14-5-15
    - build-android14-6-1
    - build-android15-6-6
    - build-android16-6-12

    steps:
    - name: Download Misc Artifacts
      uses: actions/download-artifact@v7
      with:
        path: ./downloaded-artifacts
        pattern: '*-Rejects'
        merge-multiple: false

    - name: Process Reject Artifacts
      run: |
        mkdir -p aio-rejects

        # Iterate over Rejects artifacts in downloaded-artifacts
        for dir in ./downloaded-artifacts/*-Rejects; do
            [ -d "$dir" ] || continue

            dirname=$(basename "$dir")
            original_name=${dirname%-Rejects}
            source_dir="$dir"

            if [ -d "$dir/patch-rejects" ]; then
              source_dir="$dir/patch-rejects"
            fi

            mapfile -t rej_files < <(find "$source_dir" -type f -name '*.rej' | sort)
            filtered_rej_files=()
            for rej_file in "${rej_files[@]}"; do
              rel_rej="${rej_file#${source_dir}/}"
              rel_name="$(basename "$rel_rej")"
              if [ "$rel_rej" = "common/mm/rmap.c.rej" ] || [ "$rel_name" = "i2c-nomadik.c.rej" ]; then
                echo "Skipping $rel_rej because it is an ignored reject file"
                continue
              fi
              filtered_rej_files+=("$rej_file")
            done

            if [ "${#filtered_rej_files[@]}" -eq 0 ]; then
              echo "Skipping $dirname because it only contains ignored reject files"
              continue
            fi

            mkdir -p "aio-rejects/$original_name"

            if [ -d "$dir/patch-rejects" ]; then
              cp -r "$dir/patch-rejects/." "aio-rejects/$original_name/"
            else
              cp -r "$dir/." "aio-rejects/$original_name/"
            fi

            find "aio-rejects/$original_name" -type f -name 'i2c-nomadik.c.rej' -delete
        done

        if [ "$(ls -A aio-rejects)" ]; then
            cd aio-rejects
            zip -r -q -9 ../AIO-REJ.zip .
            cd ..
        else
            echo "No rejects found to upload."
        fi

    - name: Rejects Summary
      run: |
        echo "Reject artifacts were collected locally only and are not uploaded." >> "$GITHUB_STEP_SUMMARY"

    - name: Upload AIO-REJ Artifact
      uses: actions/upload-artifact@v7
      with:
        name: AIO-REJ
        path: AIO-REJ.zip
        if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && !inputs.test_release_notes && (inputs.release_type == 'Pre-Release' || inputs.release_type == 'Release')
    permissions:
      contents: write
    needs:
    - build-android12-5-10
    - build-android13-5-10
    - build-android13-5-15
    - build-android14-5-15
    - build-android14-6-1
    - build-android15-6-6
    - build-android16-6-12
    - build-nomount-module
    - publish-manager-artifacts

    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
    - name: Validate Selected Builds
      run: |
        set -euo pipefail

        failed=0
        current_type="${{ inputs.kernel_build_version }}"

        check_selected() {
          local target="$1"
          local job_name="$2"
          local result="$3"
          
          if [[ "$current_type" == "all" || "$current_type" == "$target" ]]; then
            if [[ "$result" != "success" ]]; then
              echo "Required job $job_name did not succeed (result: $result)"
              failed=1
            fi
          fi
        }

        check_selected "5.10.x-android12" "build-android12-5-10" "${{ needs.build-android12-5-10.result }}"
        check_selected "5.10.x-android13" "build-android13-5-10" "${{ needs.build-android13-5-10.result }}"
        check_selected "5.15.x-android13" "build-android13-5-15" "${{ needs.build-android13-5-15.result }}"
        check_selected "5.15.x-android14" "build-android14-5-15" "${{ needs.build-android14-5-15.result }}"
        check_selected "6.1.x-android14" "build-android14-6-1" "${{ needs.build-android14-6-1.result }}"
        check_selected "6.6.x-android15" "build-android15-6-6" "${{ needs.build-android15-6-6.result }}"
        check_selected "6.12.x-android16" "build-android16-6-12" "${{ needs.build-android16-6-12.result }}"

        if [[ "$failed" -ne 0 ]]; then
          exit 1
        fi

    - name: Free Disk Space
      if: true
      uses: endersonmenezes/free-disk-space@v3  # Use @main for latest, @v3 for stable
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"  # Use 'rmz' for faster deletion (default: 'rm')
        rmz_version: "3.1.1"  # Required when rm_cmd is 'rmz'
        testing: false

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Generate New Tag
      id: tag
      if: inputs.release_type != 'Action'
      run: |
        mapfile -t RELEASE_TAGS < <(gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" --jq '.[].name' 2>/dev/null | grep -E '^r[0-9]+$' || true)

        LATEST_REV=0
        for TAG in "${RELEASE_TAGS[@]}"; do
          REV="${TAG#r}"
          if [[ "$REV" =~ ^[0-9]+$ && "$REV" -gt "$LATEST_REV" ]]; then
            LATEST_REV="$REV"
          fi
        done

        if [[ "$LATEST_REV" -gt 0 ]]; then
          NEW_TAG="r$((LATEST_REV + 1))"
        else
          NEW_TAG="r1"
        fi

        if [[ ${#RELEASE_TAGS[@]} -gt 0 ]]; then
          echo "Latest r-tag: r${LATEST_REV}"
        else
          echo "No existing r-tags found; starting at r1"
        fi
        echo "New tag: $NEW_TAG"
        echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
        echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

    - name: Set Release Title
      id: release_meta
      run: |
        set -euo pipefail

        # Format release title: convert rN -> Release N
        if [[ "${NEW_TAG}" =~ ^r([0-9]+)$ ]]; then
          REV_NUM="${BASH_REMATCH[1]}"
          release_title="Release ${REV_NUM}"
        else
          release_title="Release ${NEW_TAG}"
        fi

        echo "release_title=$release_title" >> "$GITHUB_OUTPUT"

    - name: Extract KernelSU Version Info
      id: ksu_version
      run: |
        set -euo pipefail

        KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"
        KSU_INPUT="dev-susfs"

        # Try as branch first, fall back to commit
        if git ls-remote --heads "$KSU_REPO" "$KSU_INPUT" | grep -q .; then
          echo "Cloning KernelSU-Next from branch: $KSU_INPUT"
          git clone --branch "$KSU_INPUT" "$KSU_REPO" /tmp/kernelsu-next
          cd /tmp/kernelsu-next
          KSUN_COMMIT=$(git rev-parse HEAD)
        else
          echo "Cloning KernelSU-Next from dev-susfs branch, then checking out commit: $KSU_INPUT"
          git clone --branch dev-susfs "$KSU_REPO" /tmp/kernelsu-next
          cd /tmp/kernelsu-next
          git fetch --depth=50 origin "$KSU_INPUT"
          git checkout "$KSU_INPUT"
          KSUN_COMMIT="$KSU_INPUT"
        fi

        # The manager is built on the OFFICIAL KernelSU-Next repo
        # (pershoot's workflows are all disabled). Find the official dev
        # commit this fork's branch is synced with (merge-base of our
        # branch vs official dev), then link the manager build run for
        # that commit. pershoot's own dev branch is intentionally ignored.
        retry() {
          local n=0
          until [ "$n" -ge 5 ]; do
            "$@" && return 0
            n=$((n+1))
            echo "retry $n/5 failed for: $*" >&2
            sleep 5
          done
          return 1
        }

        OFFICIAL_KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
        retry git fetch "$OFFICIAL_KSU_REPO" dev
        STOCK_COMMIT=$(git merge-base HEAD FETCH_HEAD)
        echo "KSU Stock Commit (official sync point): $STOCK_COMMIT"

        # Extract version info - anchored to the official sync point
        # (STOCK_COMMIT), i.e. the commit the linked manager is built from.
        # Mirrors pershoot c0a2c5fd: count the merge-base with origin, not
        # the fork's extra commits, so the version shown in the release
        # notes matches what the kernel reports and the manager displays.
        COMMITS_COUNT=$(git rev-list --count "$STOCK_COMMIT")
        BASE_VERSION=30000
        KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)

        # Extract git tag at the sync point
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 "$STOCK_COMMIT" 2>/dev/null || echo "no-tag")

        MANAGER_RUN_ID=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/actions/workflows/build-manager-ci.yml/runs?head_sha=${STOCK_COMMIT}" | jq -r '.workflow_runs[0].id // empty')
        if [[ -n "${MANAGER_RUN_ID:-}" ]]; then
          KSU_MANAGER="https://github.com/KernelSU-Next/KernelSU-Next/actions/runs/${MANAGER_RUN_ID}"
          KSU_MANAGER_NOTE="built from stock dev commit ${STOCK_COMMIT:0:12} (exact match)"
        else
          # Validated up-front in resolve-sources; a release cannot proceed without
          # the exact manager run. Fail rather than link a mismatched manager.
          echo "ERROR: exact manager build no longer available for ${STOCK_COMMIT}" >&2
          exit 1
        fi

        echo "Commits count: $COMMITS_COUNT"
        echo "KSU Version: $KSU_VERSION"
        echo "KSU Git Tag: $KSU_GIT_TAG"
        echo "KSU Manager: $KSU_MANAGER"

        # Export as environment for next step
        echo "KSUN_BRANCH=$KSU_INPUT" >> $GITHUB_ENV
        echo "KSUN_COMMIT=$KSUN_COMMIT" >> $GITHUB_ENV
        echo "KSU_COMMITS_COUNT=$COMMITS_COUNT" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_MANAGER=$KSU_MANAGER" >> $GITHUB_ENV
        echo "KSU_MANAGER_NOTE=${KSU_MANAGER_NOTE:-}" >> $GITHUB_ENV
        echo "MANAGER_RUN_ID=$MANAGER_RUN_ID" >> $GITHUB_ENV

    - name: Set release body
      env:
        ROOT_FLAVOR: ${{ inputs.root_flavor }}
        FEATURE_SET: ${{ needs.resolve-sources.outputs.feature_set }}
        MANAGER_LIST: ${{ needs.resolve-sources.outputs.manager_list }}
        ROOT_MATRIX: ${{ needs.resolve-sources.outputs.root_matrix }}
        USE_SUSFS: ${{ inputs.use_susfs }}
        USE_NOMOUNT: ${{ inputs.use_nomount }}
        USE_BBG: ${{ inputs.use_bbg }}
        USE_DS: ${{ inputs.use_ds }}
        USE_NET: ${{ inputs.use_net }}
        USE_NTSYNC: ${{ inputs.use_ntsync }}
        USE_PTRACE: ${{ inputs.use_ptrace }}
        USE_UNICODE: ${{ inputs.use_unicode }}
        USE_BPF: ${{ inputs.use_bpf }}
        USE_PERF: ${{ inputs.use_perf }}
        USE_CACHE: ${{ inputs.use_cache }}
        KERNEL_BUILD_VERSION: ${{ inputs.kernel_build_version }}
        NOMOUNT_COMMIT: ${{ needs.resolve-sources.outputs.nomount_commit }}
        KSU_COMMIT: ${{ needs.resolve-sources.outputs.ksu_commit }}
        RESUKISU_COMMIT: ${{ needs.resolve-sources.outputs.resukisu_commit }}
        KERNELSU_COMMIT: ${{ needs.resolve-sources.outputs.kernelsu_commit }}
        KERNEL_PATCHES_COMMIT: ${{ needs.resolve-sources.outputs.kernel_patches_commit }}
        ANYKERNEL3_COMMIT: ${{ needs.resolve-sources.outputs.anykernel3_commit }}
        DROIDSPACES_COMMIT: ${{ needs.resolve-sources.outputs.droidspaces_commit }}
        SUSFS_ANDROID12_5_10: ${{ needs.resolve-sources.outputs.susfs_commit_android12_5_10 }}
        SUSFS_ANDROID13_5_10: ${{ needs.resolve-sources.outputs.susfs_commit_android13_5_10 }}
        SUSFS_ANDROID13_5_15: ${{ needs.resolve-sources.outputs.susfs_commit_android13_5_15 }}
        SUSFS_ANDROID14_5_15: ${{ needs.resolve-sources.outputs.susfs_commit_android14_5_15 }}
        SUSFS_ANDROID14_6_1: ${{ needs.resolve-sources.outputs.susfs_commit_android14_6_1 }}
        SUSFS_ANDROID15_6_6: ${{ needs.resolve-sources.outputs.susfs_commit_android15_6_6 }}
        SUSFS_ANDROID16_6_12: ${{ needs.resolve-sources.outputs.susfs_commit_android16_6_12 }}
        SUSFS_ANDROID12_5_10_RESUKISU: ${{ needs.resolve-sources.outputs.susfs_commit_android12_5_10_resukisu }}
        SUSFS_ANDROID13_5_10_RESUKISU: ${{ needs.resolve-sources.outputs.susfs_commit_android13_5_10_resukisu }}
        SUSFS_ANDROID13_5_15_RESUKISU: ${{ needs.resolve-sources.outputs.susfs_commit_android13_5_15_resukisu }}
        SUSFS_ANDROID14_5_15_RESUKISU: ${{ needs.resolve-sources.outputs.susfs_commit_android14_5_15_resukisu }}
        SUSFS_ANDROID14_6_1_RESUKISU: ${{ needs.resolve-sources.outputs.susfs_commit_android14_6_1_resukisu }}
        SUSFS_ANDROID15_6_6_RESUKISU: ${{ needs.resolve-sources.outputs.susfs_commit_android15_6_6_resukisu }}
        SUSFS_ANDROID16_6_12_RESUKISU: ${{ needs.resolve-sources.outputs.susfs_commit_android16_6_12_resukisu }}
      run: |
        set -e

        : > release_body.md

        python3 - <<'PYEOF' > release_body.md
        import json, os
        def env(n,d=""): return os.environ.get(n,d).strip() or d
        def parse_managers(raw):
            try: return json.loads(raw) if raw.strip() else []
            except: return []
        root = env("ROOT_FLAVOR","All")
        feats=[]
        if env("USE_SUSFS","true")=="true": feats.append("SUSFS")
        if env("USE_NOMOUNT","true")=="true": feats.append("NoMount")
        if env("USE_BBG","true")=="true": feats.append("Baseband Guard")
        if env("USE_DS","true")=="true": feats.append("DroidSpaces-OSS")
        if env("USE_NET","true")=="true": feats.append("Networking")
        if env("USE_NTSYNC","true")=="true": feats.append("NTSync")
        if env("USE_PTRACE","true")=="true": feats.append("Ptrace Leak Fix")
        if env("USE_UNICODE","true")=="true": feats.append("Unicode Fix")
        if env("USE_BPF","true")=="true": feats.append("BTF / eBPF / FUSE-BPF")
        if env("USE_PERF","false")=="true": feats.append("Performance Tuning")
        lines=[]
        lines.append("# Wild Kernels for GKI2 Devices")
        lines.append("")
        lines.append("## Root")
        lines.append("")
        ksun_branch=env("KSUN_BRANCH","dev-susfs")
        ksun_commit=env("KSUN_COMMIT","")
        ksu_commit=env("KSU_COMMIT","")
        resukisu_commit=env("RESUKISU_COMMIT","")
        kernelsu_commit=env("KERNELSU_COMMIT","")
        nm=env("NOMOUNT_COMMIT","")
        kp=env("KERNEL_PATCHES_COMMIT","")
        ak=env("ANYKERNEL3_COMMIT","")
        ds=env("DROIDSPACES_COMMIT","")
        _rmatrix={}
        try: _rmatrix={m.get("root_flavor",""):m.get("root_commit","") for m in json.loads(env("ROOT_MATRIX","[]")) if isinstance(m,dict)}
        except: pass
        if env("USE_SUSFS","true")=="true":
            _next_url="https://github.com/pershoot/KernelSU-Next/commit/"
        else:
            _next_url="https://github.com/KernelSU-Next/KernelSU-Next/commit/"
        _root_urls={"next":_next_url,"kernelsu":"https://github.com/tiann/KernelSU/commit/","resukisu":"https://github.com/ReSukiSU/ReSukiSU/commit/"}
        _root_commits={"next":_rmatrix.get("next","") or kernelsu_commit,"kernelsu":_rmatrix.get("kernelsu","") or ksu_commit,"resukisu":_rmatrix.get("resukisu","") or resukisu_commit}
        _flavors0=[m.get("flavor","") for m in parse_managers(env("MANAGER_LIST","")) if m.get("flavor","")]
        if not _flavors0:
            _flavors0={"KernelSU-Next":["next"],"KernelSU":["kernelsu"],"ReSukiSU":["resukisu"],"All":["next","kernelsu","resukisu"]}.get(root,["next","kernelsu","resukisu"])
        _labels0={"next":"KernelSU-Next","kernelsu":"KernelSU","resukisu":"ReSukiSU"}
        _rc=[]
        for _fl0 in _flavors0:
            _c=_root_commits.get(_fl0,"")
            if _c and len(_c)==40: _rc.append(f"{_labels0.get(_fl0,_fl0)} [`{_c[:7]}`]({_root_urls[_fl0]}{_c})")
            elif _c: _rc.append(f"{_labels0.get(_fl0,_fl0)} `{_c}`")
        for _r in _rc: lines.append(f"- {_r}")
        lines.append("")
        lines.append("## Features")
        lines.append("")
        _kp_url="https://github.com/WildKernels/kernel_patches/commit/"
        _feat_commit={"NoMount":("https://github.com/maxsteeel/nomount/commit/",nm),"Baseband Guard":(_kp_url,kp),"DroidSpaces-OSS":("https://github.com/ravindu644/Droidspaces-OSS/commit/",ds)}
        for f in feats:
            _u,_c=_feat_commit.get(f,("",""))
            if _c and len(_c)==40: lines.append(f"- {f} [`{_c[:7]}`]({_u}{_c})")
            elif _c: lines.append(f"- {f} `{_c}`")
            else: lines.append(f"- {f}")
        if not feats: lines.append("- (none)")
        kp=env("KERNEL_PATCHES_COMMIT","")
        ak=env("ANYKERNEL3_COMMIT","")
        ds=env("DROIDSPACES_COMMIT","")
        lines.append("")
        lines.append("## SUSFS commits")
        lines.append("")
        all_variants=["android12-5.10","android13-5.10","android13-5.15","android14-5.15","android14-6.1","android15-6.6","android16-6.12"]
        def kbv_to_variant(kbv):
            if ".x-android" in kbv:
                kv, av = kbv.split(".x-android", 1)
                v = f"android{av}-{kv}"
                return v if v in all_variants else ""
            return ""
        kbv=env("KERNEL_BUILD_VERSION","All")
        _sel=kbv_to_variant(kbv)
        variants=[_sel] if _sel else list(all_variants)
        sus_map={"android12-5.10":env("SUSFS_ANDROID12_5_10",""),"android13-5.10":env("SUSFS_ANDROID13_5_10",""),"android13-5.15":env("SUSFS_ANDROID13_5_15",""),"android14-5.15":env("SUSFS_ANDROID14_5_15",""),"android14-6.1":env("SUSFS_ANDROID14_6_1",""),"android15-6.6":env("SUSFS_ANDROID15_6_6",""),"android16-6.12":env("SUSFS_ANDROID16_6_12","")}
        sus_map_resukisu={"android12-5.10":env("SUSFS_ANDROID12_5_10_RESUKISU",""),"android13-5.10":env("SUSFS_ANDROID13_5_10_RESUKISU",""),"android13-5.15":env("SUSFS_ANDROID13_5_15_RESUKISU",""),"android14-5.15":env("SUSFS_ANDROID14_5_15_RESUKISU",""),"android14-6.1":env("SUSFS_ANDROID14_6_1_RESUKISU",""),"android15-6.6":env("SUSFS_ANDROID15_6_6_RESUKISU",""),"android16-6.12":env("SUSFS_ANDROID16_6_12_RESUKISU","")}
        _flavors=[m.get("flavor","") for m in parse_managers(env("MANAGER_LIST","")) if m.get("flavor","")]
        if not _flavors:
            _flavors={"KernelSU-Next":["next"],"KernelSU":["kernelsu"],"ReSukiSU":["resukisu"],"All":["next","kernelsu","resukisu"]}.get(root,["next","kernelsu","resukisu"])
        _labels={"next":"KernelSU-Next","kernelsu":"KernelSU","resukisu":"ReSukiSU"}
        _susfs_url="https://gitlab.com/simonpunk/susfs4ksu"
        lines.append("| SUSFS branch |" + "".join(f" {_labels.get(_fl,_fl)} |" for _fl in _flavors))
        lines.append("|---" * (len(_flavors) + 1) + "|")
        for v in variants:
            _row=f"| gki-{v} |"
            for _fl in _flavors:
                _sm=sus_map_resukisu if _fl=="resukisu" else sus_map
                sha=_sm.get(v,"")
                sha_s=f"[`{sha[:7]}`]({_susfs_url}/-/commit/{sha})" if sha else "_n/a_"
                _row+=f" {sha_s} |"
            lines.append(_row)
        lines.append("")
        lines.append("")
        output="\n".join(lines)+"\n"
        print(output,end="")
        s=os.environ.get("GITHUB_STEP_SUMMARY")
        if s: open(s,"a").write(output)
        PYEOF

    - name: Upload release notes artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-notes
        path: release_body.md
        retention-days: 7
        if-no-files-found: error

    - name: Download Manager APK zips
      uses: actions/download-artifact@v7
      with:
        path: release-assets/manager
        pattern: '*.apk'
        merge-multiple: true
        if-no-files-found: ignore

    - name: Download AnyKernel3 Artifacts
      uses: actions/download-artifact@v7
      with:
        path: release-assets
        pattern: '*-AnyKernel3'
        merge-multiple: false

    - name: Download NoMount metamodule
      uses: actions/download-artifact@v7
      with:
        path: release-assets
        pattern: '*NoMount-Metamodule'
        merge-multiple: false
        if-no-files-found: ignore

    - name: Zip AnyKernel3 for Release
      run: |
        set -e
        shopt -s nullglob

        for dir in release-assets/*-AnyKernel3; do
          zip_name="${dir}.zip"
          rm -f "$zip_name"
          cd "$dir"
          zip -r -q -9 "../$(basename "$zip_name")" .
          cd - >/dev/null
        done

    - name: Zip NoMount Metamodule for Release
      run: |
        set -e
        shopt -s nullglob

        for dir in release-assets/*NoMount-Metamodule; do
          zip_name="${dir}.zip"
          rm -f "$zip_name"
          cd "$dir"
          zip -r -q -9 "../$(basename "$zip_name")" .
          cd - >/dev/null
        done

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ steps.tag.outputs.new_tag }}
        RELEASE_TITLE: ${{ steps.release_meta.outputs.release_title }}
        IS_PRERELEASE: ${{ inputs.release_type == 'Pre-Release' }}
      run: |
        set -euo pipefail
        shopt -s nullglob globstar

        # Collect assets first so a glob miss fails fast instead of mid-release.
        files=(release-assets/**/*.zip release-assets/**/*.apk release-assets/**/*-boot*.img)
        if [ "${#files[@]}" -eq 0 ]; then
          echo "No release assets found" >&2
          exit 1
        fi
        echo "Uploading ${#files[@]} assets one at a time..."

        # The release may already exist (partial upload from a retried run).
        if gh release view "$TAG_NAME" >/dev/null 2>&1; then
          echo "Release $TAG_NAME already exists — uploading into it."
        else
          create_args=(--title "$RELEASE_TITLE" --notes-file release_body.md)
          if [ "$IS_PRERELEASE" = "true" ]; then
            create_args+=(--prerelease)
          fi
          gh release create "$TAG_NAME" "${create_args[@]}"
        fi

        # Sequential uploads: one asset at a time with per-file retries.
        # (The previous single-step bulk upload fired ~500 concurrent
        # uploads and got the runner killed twice at the same point.)
        failed=0
        for f in "${files[@]}"; do
          ok=false
          for attempt in 1 2 3; do
            if gh release upload "$TAG_NAME" "$f" --clobber; then
              ok=true
              break
            fi
            echo "Attempt $attempt/3 failed for: $f" >&2
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          if [ "$ok" = false ]; then
            echo "ERROR: giving up on $f" >&2
            failed=1
          fi
        done
        exit "$failed"

  nightly-release:
    if: always() && github.event_name == 'workflow_dispatch' && !inputs.test_release_notes && inputs.release_type == 'Action'
    needs: [notes-preview]
    runs-on: ubuntu-latest
    concurrency:
      group: nightly-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Download release notes preview
        uses: actions/download-artifact@v7
        with:
          name: release-notes-preview
          path: nightly
          if-no-files-found: error

      - name: Append nightly.link URL
        run: |
          {
            echo ""
            echo "- **Nightly artifacts:** https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- **Note:** not every kernel version is necessarily built in a nightly run — the link above lists exactly what this run produced."
          } >> nightly/release_body.md
          cat nightly/release_body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Replace nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete nightly --cleanup-tag -y || true
          if git ls-remote --tags origin nightly | grep -q 'refs/tags/nightly'; then
            git push --delete origin nightly || true
          fi
          gh release create nightly \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Nightly (${{ github.ref_name }} $(date -u +%Y-%m-%d))" \
            --notes-file nightly/release_body.md

