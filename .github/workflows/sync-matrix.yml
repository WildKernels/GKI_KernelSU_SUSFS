name: Sync Kernel Matrix

# Adds new upstream monthly branches to the build matrix via PR against
# main. If a sync PR is already open, it is updated in place (the sync
# branch is rebuilt from main each run, so PRs never stack). Dead/retired branches
# need no action: download-kernel falls back to the latest release tag.
#
# NOTE: scheduled runs only fire from the default branch, so the cron
# below stays dormant until this file exists on main. workflow_dispatch
# works from any branch right away.

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: '0 5 * * *'  # midnight EST (5am UTC)
  workflow_dispatch:

jobs:
  sync-matrix:
    # Fork gate (#328): cron runs need ENABLE_SCHEDULED_BUILDS=true (Actions
    # variable). Forks inherit the workflow but not the variable, so their
    # daily matrix-sync cron skips instead of opening PRs on the fork.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_BUILDS == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare sync branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main bot/sync-kernel-matrix || true
          git checkout -B bot/sync-kernel-matrix origin/main

      - name: Add new upstream months
        id: sync
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import glob, json, os, re, shutil, subprocess, tempfile

          COMMON_URL = "https://android.googlesource.com/kernel/common"
          MONTH = re.compile(r"^(\d{4}-\d{2})$")
          added = []
          replaced = []

          def ls_heads(pattern):
              r = subprocess.run(
                  ["git", "ls-remote", COMMON_URL, pattern],
                  capture_output=True, text=True, timeout=120,
              )
              if r.returncode != 0:
                  print(f"WARNING: ls-remote failed for {pattern}; skipping")
                  return set()
              return {line.split()[1] for line in r.stdout.splitlines() if line}

          for path in sorted(glob.glob(".github/config/*.json")):
              with open(path) as f:
                  cfg = json.load(f)
              version = cfg["version"]
              have = {e["date"] for e in cfg["include"]}

              live_refs = ls_heads(f"refs/heads/{version}-*")
              live = set()
              for ref in live_refs:
                  m = re.search(rf"{re.escape(version)}-(\d{{4}}-\d{{2}})$", ref)
                  if m:
                      live.add(m.group(1))
              if not live_refs:
                  continue

              dep_refs = ls_heads(f"refs/heads/deprecated/{version}-*")
              deprecated = set()
              for ref in dep_refs:
                  m = re.search(rf"{re.escape(version)}-(\d{{4}}-\d{{2}})$", ref)
                  if m:
                      deprecated.add(m.group(1))

              # Dead heads need no action (tag fallback covers them); just note them.
              for date in sorted(have):
                  if MONTH.match(date) and date not in live and date not in deprecated:
                      print(f"NOTE: {version} {date}: head retired upstream, builds use latest tag")

              version_added = False
              for month in sorted(live - have):
                  head = f"{version}-{month}"
                  tmp = tempfile.mkdtemp(prefix="newk-")
                  try:
                      # --no-checkout, not --sparse: a sparse clone leaves the
                      # working tree unpopulated, so reading Makefile off disk
                      # raised FileNotFoundError while the clone itself exited 0.
                      # Reading the blob straight from the object store avoids
                      # the working tree entirely.
                      subprocess.run(
                          ["git", "clone", "--filter=blob:none", "--no-checkout",
                           "--depth", "1", "--branch", head, COMMON_URL, tmp],
                          check=True, capture_output=True, timeout=600,
                      )
                      sub = None
                      r = subprocess.run(
                          ["git", "-C", tmp, "show", "HEAD:Makefile"],
                          check=True, capture_output=True, text=True, timeout=120,
                      )
                      for line in r.stdout.splitlines():
                          if line.startswith("SUBLEVEL ="):
                              sub = line.split("=", 1)[1].strip()
                              break
                      if sub is None:
                          print(f"WARNING: no SUBLEVEL in {head}; skipping")
                          continue
                      # One ACTIVE row per sublevel: a re-published sublevel keeps
                      # the old row in the file but switches it off ("disabled":
                      # true), so a numeric sublevel still resolves to exactly one
                      # month and the older snapshot can be restored by deleting
                      # one word. Nothing is ever deleted here.
                      superseded = [e for e in cfg["include"] if e.get("sublevel") == sub]
                      for old in superseded:
                          was_disabled = bool(old.get("disabled"))
                          old["disabled"] = True
                          replaced.append(
                              f"{version} {month} (sublevel {sub}) disables "
                              f"{old['date']} (sublevel {sub})"
                              + (" [was already disabled]" if was_disabled else "")
                          )
                          print(
                              f"DISABLE: {version} sublevel {sub} "
                              f"{old['date']} (superseded by {month})"
                          )
                      cfg["include"].append({"sublevel": sub, "date": month})
                      added.append(f"{version} {month} (sublevel {sub})")
                      version_added = True
                      print(f"ADD: {version} {month} (sublevel {sub})")
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as e:
                      print(f"WARNING: could not resolve {head} ({e}); skipping")
                      continue
                  finally:
                      shutil.rmtree(tmp, ignore_errors=True)

              if version_added:
                  cfg["include"].sort(key=lambda e: e["date"])
                  with open(path, "w") as f:
                      json.dump(cfg, f, indent=2)
                      f.write("\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if added else 'false'}\n")
              f.write(f"added={'; '.join(added)}\n")
              f.write(f"replaced={'; '.join(replaced)}\n")
          EOF

      - name: Open or update sync PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="bot/sync-kernel-matrix"
          git add .github/config/
          git commit -m "Sync kernel matrix: add ${{ steps.sync.outputs.added }}"
          git push --force-with-lease origin "$BRANCH" || git push origin "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --base main --json number --jq 'length')" = "0" ]; then
            BODY=$(printf '%s' "${{ steps.sync.outputs.added }}" | sed 's/; /\n- /g; s/^/- /')
            REPLACED="${{ steps.sync.outputs.replaced }}"
            if [ -n "$REPLACED" ]; then
              REPLACED_BODY=$(printf '%s' "$REPLACED" | sed 's/; /\n- /g; s/^/- /')
              PR_BODY=$(printf 'New monthly branches detected upstream, sublevels resolved from source:\n\n%s\n\n### Replaced rows\n\nOne row per sublevel: the new month supersedes these older rows, which were removed. If you need one of them back, say so here and it can be re-enabled as `"disabled": true` instead of being deleted.\n\n%s\n\nDead/retired branches need no action (tag fallback covers them).' "$BODY" "$REPLACED_BODY")
            else
              PR_BODY=$(printf 'New monthly branches detected upstream, sublevels resolved from source:\n\n%s\n\nNo rows were replaced: every new sublevel was unique.\n\nDead/retired branches need no action (tag fallback covers them).' "$BODY")
            fi
            gh pr create --head "$BRANCH" --base main \
              --title "Sync kernel matrix: add new upstream months" \
              --body "$PR_BODY"
          else
            # A PR already open must get the same replaced-rows note, otherwise a
            # re-sync that supersedes rows would silently change the matrix with
            # nothing in the PR to review. Rebuild the body and edit it in place.
            BODY=$(printf '%s' "${{ steps.sync.outputs.added }}" | sed 's/; /\n- /g; s/^/- /')
            REPLACED="${{ steps.sync.outputs.replaced }}"
            if [ -n "$REPLACED" ]; then
              REPLACED_BODY=$(printf '%s' "$REPLACED" | sed 's/; /\n- /g; s/^/- /')
              PR_BODY=$(printf 'New monthly branches detected upstream, sublevels resolved from source:\n\n%s\n\n### Replaced rows\n\nOne row per sublevel: the new month supersedes these older rows, which were removed. If you need one of them back, say so here and it can be re-enabled as `"disabled": true` instead of being deleted.\n\n%s\n\nDead/retired branches need no action (tag fallback covers them).' "$BODY" "$REPLACED_BODY")
            else
              PR_BODY=$(printf 'New monthly branches detected upstream, sublevels resolved from source:\n\n%s\n\nNo rows were replaced: every new sublevel was unique.\n\nDead/retired branches need no action (tag fallback covers them).' "$BODY")
            fi
            PR_NUM=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')
            gh pr edit "$PR_NUM" --body "$PR_BODY"
            echo "Sync PR #${PR_NUM} updated in place (body refreshed with the replaced rows)."
          fi
